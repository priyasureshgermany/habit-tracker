<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Habit Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Habits, fitness and a diary in one offline app, with an optional GitHub backup.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" id="themeColorMeta" content="#F5F3FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habits">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script>
/* Theme before first paint, so a dark-mode user never sees a white flash. */
try{
  var t = localStorage.getItem("habits.theme");
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  var a = localStorage.getItem("habits.accent");
  if (a) document.documentElement.dataset.accent = a;
}catch(e){}
</script>
<style>
/* ============================================================
   TOKENS — light is the full set; dark redefines tokens only
   ============================================================ */
:root{
  color-scheme:light;
  --ground:#F4F2FB;
  --ground-2:#ECE8F8;
  --surface:#FFFFFF;
  --surface-2:#F6F4FC;
  --surface-sunk:#ECE9F5;
  --ink:#17132B;
  --ink-2:#4E4867;
  --ink-3:#8A84A3;
  --line:#E5E1F1;
  --line-strong:#CFC9E3;
  --glass:rgba(255,255,255,.72);

  --a1:#7C3AED; --a2:#14B8A6;          /* the accent is a pair: start and end of a gradient */
  --accent:var(--a1);
  --accent-ink:#FFFFFF;
  --accent-soft:color-mix(in oklab, var(--a1) 12%, var(--surface));
  --grad:linear-gradient(135deg, var(--a1), var(--a2));

  --good:#059669; --good-soft:#D1FAE5;
  --warn:#B45309; --warn-soft:#FEF3C7;
  --bad:#DC2626;  --bad-soft:#FEE2E2;
  --flame:#F97316;

  --shadow-sm:0 1px 2px rgba(23,19,43,.06), 0 1px 1px rgba(23,19,43,.04);
  --shadow-md:0 6px 24px rgba(60,40,140,.10);
  --shadow-lg:0 -10px 40px rgba(23,19,43,.22);

  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px;
  --sans:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shell:560px;
  --tabh:72px;
}
:root[data-accent="ocean"]{ --a1:#2563EB; --a2:#06B6D4; }
:root[data-accent="sunset"]{ --a1:#E11D48; --a2:#F59E0B; }
:root[data-accent="forest"]{ --a1:#047857; --a2:#84CC16; }
:root[data-accent="berry"]{ --a1:#C026D3; --a2:#6366F1; }

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E0C18; --ground-2:#151225;
    --surface:#1A1729; --surface-2:#221E35; --surface-sunk:#13111F;
    --ink:#EEEBFA; --ink-2:#B2ABCF; --ink-3:#7D7699;
    --line:#2A2540; --line-strong:#3B3558;
    --glass:rgba(26,23,41,.78);
    --accent:color-mix(in oklab, var(--a1) 70%, white);
    --accent-soft:color-mix(in oklab, var(--a1) 22%, var(--surface));
    --good:#34D399; --good-soft:#0B2C22;
    --warn:#FBBF24; --warn-soft:#2E230B;
    --bad:#F87171;  --bad-soft:#341414;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 6px 24px rgba(0,0,0,.45);
    --shadow-lg:0 -10px 40px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E0C18; --ground-2:#151225;
  --surface:#1A1729; --surface-2:#221E35; --surface-sunk:#13111F;
  --ink:#EEEBFA; --ink-2:#B2ABCF; --ink-3:#7D7699;
  --line:#2A2540; --line-strong:#3B3558;
  --glass:rgba(26,23,41,.78);
  --accent:color-mix(in oklab, var(--a1) 70%, white);
  --accent-soft:color-mix(in oklab, var(--a1) 22%, var(--surface));
  --good:#34D399; --good-soft:#0B2C22;
  --warn:#FBBF24; --warn-soft:#2E230B;
  --bad:#F87171;  --bad-soft:#341414;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 6px 24px rgba(0,0,0,.45);
  --shadow-lg:0 -10px 40px rgba(0,0,0,.6);
}

*,*::before,*::after{box-sizing:border-box}
html,body{scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,.sheet-body::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:none}
body{
  margin:0; min-height:100vh;
  background:
    radial-gradient(1200px 500px at 110% -10%, color-mix(in oklab, var(--a2) 16%, transparent), transparent 60%),
    radial-gradient(900px 500px at -20% 0%, color-mix(in oklab, var(--a1) 14%, transparent), transparent 60%),
    var(--ground);
  background-attachment:fixed;
  color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none !important}

/* Room at the foot for the tab bar AND the + button above it, so the last
   item on any screen can always be scrolled clear of both. */
.shell{max-width:var(--shell);margin:0 auto;padding:0 16px calc(var(--tabh) + 104px + env(safe-area-inset-bottom));padding-top:env(safe-area-inset-top)}
.view{display:none}
.view.on{display:block;animation:viewIn .28s ease both}
@keyframes viewIn{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- header ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:22px 2px 14px}
.top h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.top .kicker{font-size:13px;color:var(--ink-3);font-weight:600;margin-bottom:4px}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow-sm);border:1px solid var(--line);flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn.grad{background:var(--grad);color:#fff;border:none;box-shadow:0 6px 18px color-mix(in oklab,var(--a1) 40%,transparent)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-sm);margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .more{margin-left:auto;font-size:13px;font-weight:600;color:var(--accent)}
.sec-h{display:flex;align-items:center;gap:8px;margin:20px 2px 10px;font-size:13px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.sec-h .more{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--accent);font-weight:600}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.hero{
  position:relative;overflow:hidden;border-radius:var(--r-xl);padding:20px;color:#fff;margin-bottom:14px;
  background:var(--grad);box-shadow:0 14px 40px color-mix(in oklab,var(--a1) 30%,transparent);
}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{width:220px;height:220px;right:-70px;top:-90px}
.hero::after{width:140px;height:140px;right:60px;bottom:-80px;background:rgba(255,255,255,.08)}
.hero > *{position:relative;z-index:1}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.hero .sub{opacity:.9;font-size:14px}
.hero .ringwrap{width:104px;height:104px;flex:none}

/* ---------- date strip ---------- */
.dstrip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}
.dstrip::-webkit-scrollbar{display:none}
.dchip{flex:none;width:48px;padding:8px 0 9px;border-radius:16px;text-align:center;background:var(--surface);border:1px solid var(--line);scroll-snap-align:center;position:relative}
.dchip .dw{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase}
.dchip .dn{font-size:17px;font-weight:800;margin-top:2px}
.dchip .dp{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:18px;height:3px;border-radius:2px;background:var(--line)}
.dchip .dp i{display:block;height:100%;border-radius:2px;background:var(--good)}
.dchip.today .dn{color:var(--accent)}
.dchip.sel{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 16px color-mix(in oklab,var(--a1) 35%,transparent)}
.dchip.sel .dw,.dchip.sel .dn{color:#fff}
.dchip.sel .dp{background:rgba(255,255,255,.35)}.dchip.sel .dp i{background:#fff}

/* ---------- habit rows ---------- */
.hrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 12px 12px 14px;margin-bottom:10px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:transform .15s ease}
.hrow:active{transform:scale(.99)}
.hrow .hfill{position:absolute;inset:0;width:0;background:color-mix(in oklab,var(--hc) 11%,transparent);transition:width .45s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.hrow > *{position:relative}
.hico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none;background:color-mix(in oklab,var(--hc) 16%,var(--surface))}
.hname{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmeta{font-size:12.5px;color:var(--ink-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.streak{display:inline-flex;align-items:center;gap:3px;color:var(--flame);font-weight:700}
.hrow.done .hname{color:var(--ink-2)}
.hrow.skip{opacity:.6}
.check{width:40px;height:40px;border-radius:50%;border:2.5px solid color-mix(in oklab,var(--hc) 55%,var(--line));display:grid;place-items:center;flex:none;transition:all .2s ease;color:#fff}
.check svg{width:20px;height:20px;opacity:0;transform:scale(.5);transition:all .2s ease}
.hrow.done .check{background:var(--hc);border-color:var(--hc);box-shadow:0 4px 12px color-mix(in oklab,var(--hc) 45%,transparent)}
.hrow.done .check svg{opacity:1;transform:none}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper button{width:34px;height:34px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);font-size:18px;font-weight:700;display:grid;place-items:center}
.stepper button.plus{background:var(--hc);border-color:var(--hc);color:#fff}
.stepper .sv{min-width:48px;text-align:center;font-weight:800;font-size:14px;line-height:1.1}
.stepper .sv small{display:block;font-size:10.5px;font-weight:600;color:var(--ink-3)}
.dots7{display:flex;gap:4px;margin-top:6px}
.dots7 i{width:9px;height:9px;border-radius:3px;background:var(--surface-sunk)}
.dots7 i.on{background:var(--hc)}
.dots7 i.part{background:color-mix(in oklab,var(--hc) 45%,var(--surface-sunk))}
.dots7 i.off{background:transparent;border:1px dashed var(--line-strong)}

/* ---------- pills, chips, segmented ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent-soft);border-color:color-mix(in oklab,var(--accent) 50%,transparent);color:var(--accent)}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.hscroll .chip{flex:none}
.seg{display:flex;background:var(--surface-sunk);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--ink-3);transition:all .2s ease}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--accent-soft);color:var(--accent)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stats.two{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;box-shadow:var(--shadow-sm)}
.stat .v{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat .v small{font-size:12px;font-weight:600;color:var(--ink-3)}
.stat .l{font-size:12px;color:var(--ink-3);font-weight:600;margin-top:3px}
.bar{height:8px;border-radius:99px;background:var(--surface-sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* ---------- tiles (fitness, more) ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;text-align:left;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:6px;position:relative;transition:transform .15s ease}
.tile:active{transform:scale(.98)}
.tile .ti{font-size:26px;line-height:1}
.tile .tn{font-weight:700;font-size:14.5px}
.tile .ts{font-size:12px;color:var(--ink-3)}
.tile .tdot{position:absolute;top:12px;right:12px;width:9px;height:9px;border-radius:50%;background:var(--flame)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:14px}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:last-child{border-bottom:none}
.li .lico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--surface-2);flex:none}
.li .lt{font-weight:700;font-size:14.5px}
.li .ls{font-size:12.5px;color:var(--ink-3)}
.li .chev{color:var(--ink-3);font-size:18px}

/* ---------- body map ---------- */
.bodymap{width:100%;max-width:150px;height:auto}
.bodymap .z{fill:color-mix(in oklab,var(--ink) 13%,var(--surface));stroke:color-mix(in oklab,var(--ink) 30%,var(--surface));stroke-width:1;transition:fill .3s ease}
.bodymap .z.on{fill:var(--accent);stroke:color-mix(in oklab,var(--accent) 60%,white);filter:drop-shadow(0 0 5px color-mix(in oklab,var(--accent) 70%,transparent))}
.bodymap .base{fill:color-mix(in oklab,var(--ink) 20%,var(--surface));stroke:color-mix(in oklab,var(--ink) 30%,var(--surface));stroke-width:1}

/* ---------- exercise cards ---------- */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:10px;box-shadow:var(--shadow-sm);overflow:hidden}
.ex-h{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left}
.ex-n{font-weight:700}
.ex-s{font-size:12.5px;color:var(--ink-3)}
.ex-b{padding:0 14px 14px;display:none}
.ex.open .ex-b{display:block}
.ex ol{margin:6px 0 10px;padding-left:20px;color:var(--ink-2);font-size:14px}
.ex ol li{margin-bottom:4px}
.tipbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:10px}
.infobox{background:var(--accent-soft);color:var(--ink-2);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}

/* ---------- diary ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .cw{font-size:11px;font-weight:700;color:var(--ink-3);text-align:center;padding-bottom:2px}
.cal .cd{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--surface-2);position:relative;color:var(--ink-2)}
.cal .cd.blank{background:none}
.cal .cd:disabled{opacity:.35}
.cal .cd.has{color:#fff}
.cal .cd.today{outline:2px solid var(--accent);outline-offset:-2px}
.cal .cd.sel{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}
.cal .cd .em{font-size:18px}
.cal .cd .mic{position:absolute;right:2px;top:1px;font-size:9px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;margin-bottom:10px;box-shadow:var(--shadow-sm);text-align:left;width:100%;display:block}
.entry .eh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.entry .eface{font-size:26px}
.entry .et{white-space:pre-wrap;color:var(--ink-2);font-size:14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.moods{display:flex;justify-content:space-between;gap:6px}
.mood{flex:1;padding:10px 0 8px;border-radius:16px;background:var(--surface-2);border:2px solid transparent;text-align:center;transition:all .18s ease}
.mood .mf{font-size:30px;display:block;transition:transform .2s ease;filter:grayscale(.5)}
.mood .mn{font-size:11.5px;font-weight:700;color:var(--ink-3)}
.mood.on{border-color:var(--mc);background:color-mix(in oklab,var(--mc) 14%,var(--surface))}
.mood.on .mf{transform:scale(1.18);filter:none}
.mood.on .mn{color:var(--ink)}
.rec{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:16px;padding:10px 12px}
.recbtn{width:52px;height:52px;border-radius:50%;background:#EF4444;color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 16px rgba(239,68,68,.4);transition:transform .2s}
.recbtn svg{width:22px;height:22px}
.recbtn.on{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}50%{box-shadow:0 0 0 12px rgba(239,68,68,0)}}
.meter{flex:1;height:30px;display:flex;align-items:center;gap:2px}
.meter i{flex:1;background:var(--line-strong);border-radius:2px;height:4px;transition:height .08s}
.clip{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:14px;padding:8px 10px;margin-top:8px}
.clip audio{flex:1;min-width:0;height:36px}

/* ---------- forms ---------- */
.field{display:block;margin-bottom:14px}
.field > span{display:block;font-size:12.5px;font-weight:700;color:var(--ink-3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.input,select.input,textarea.input{width:100%;padding:12px 14px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);font-size:15px;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--accent)}
textarea.input{min-height:140px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:var(--r-md);font-weight:700;font-size:15px;background:var(--surface-2);border:1px solid var(--line)}
.btn.primary{background:var(--grad);color:#fff;border:none;box-shadow:0 8px 20px color-mix(in oklab,var(--a1) 32%,transparent)}
.btn.danger{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:12px}
.btn svg{width:18px;height:18px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{aspect-ratio:1;border-radius:12px;font-size:21px;background:var(--surface-2)}
.emojis button.on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.wdays{display:flex;gap:6px}
.wdays button{flex:1;aspect-ratio:1;max-width:44px;border-radius:50%;background:var(--surface-2);font-weight:700;font-size:13px;color:var(--ink-3)}
.wdays button.on{background:var(--grad);color:#fff}
.toggle{position:relative;width:48px;height:28px;border-radius:99px;background:var(--line-strong);flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);transition:transform .2s}
.toggle.on{background:var(--good)}
.toggle.on::after{transform:translateX(20px)}
.note{font-size:13px;color:var(--ink-3);padding:6px 2px}
.note.warn{color:var(--bad)}
.empty{text-align:center;padding:30px 20px;color:var(--ink-3)}
.empty .ei{font-size:44px;margin-bottom:8px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(calc(100% - 24px),calc(var(--shell) - 16px));
  height:var(--tabh);display:flex;align-items:center;justify-content:space-around;padding:0 6px;border-radius:24px;z-index:40;
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border:1px solid var(--line);box-shadow:var(--shadow-md)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--ink-3);padding:8px 0;border-radius:16px;position:relative;transition:color .2s}
.tab svg{width:24px;height:24px;transition:transform .2s}
.tab.on{color:var(--accent)}
.tab.on svg{transform:translateY(-1px) scale(1.08)}
.tab.on::before{content:"";position:absolute;top:2px;width:22px;height:3px;border-radius:3px;background:var(--grad)}
.fab{position:fixed;right:max(18px,calc(50% - var(--shell)/2 + 18px));bottom:calc(var(--tabh) + 26px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;background:var(--grad);color:#fff;display:grid;place-items:center;z-index:39;box-shadow:0 10px 28px color-mix(in oklab,var(--a1) 45%,transparent);transition:transform .2s}
.fab:active{transform:scale(.94)}
.fab svg{width:26px;height:26px}

/* ---------- sheets (transitions, not keyframes: a sheet must never be
   stranded invisible-but-present) ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,6,25,.45);opacity:0;transition:opacity .25s ease;z-index:50;backdrop-filter:blur(2px)}
.scrim.vis{opacity:1}
.sheet{position:fixed;left:50%;bottom:0;width:min(100%,var(--shell));max-height:92vh;transform:translate(-50%,100%);transition:transform .32s cubic-bezier(.2,.85,.25,1);z-index:51;
  background:var(--ground);border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.sheet.vis{transform:translate(-50%,0)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:10px 16px 10px;position:relative}
.sheet-h::before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);width:40px;height:4px;border-radius:2px;background:var(--line-strong)}
.sheet-h h2{margin:12px 0 0;font-size:20px;font-weight:800;flex:1;letter-spacing:-.01em}
.sheet-h .iconbtn{margin-top:10px;width:36px;height:36px}
.sheet-body{overflow-y:auto;padding:6px 16px 16px;flex:1;overscroll-behavior:contain}
.sheet-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--ground);display:flex;gap:10px}
.sheet-foot .btn{flex:1}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 30px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:90;transition:all .25s ease;pointer-events:none;max-width:calc(100% - 40px);text-align:center}
.toast.vis{opacity:1;transform:translate(-50%,0)}

/* ---------- charts ---------- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--sans);font-size:10px;fill:var(--ink-3);font-weight:600}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .goal{stroke:var(--flame);stroke-dasharray:4 4;stroke-width:1.5}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--surface-sunk)}
.hbar{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13.5px}
.hbar .hl{width:118px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.hbar .bar{flex:1;height:10px}
.hbar .hv{width:52px;text-align:right;font-weight:700;flex:none}
.rangebar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.rangebar .rl{flex:1;text-align:center;font-weight:700}

/* ---------- What's new ---------- */
.relgroup{margin-bottom:18px}
.rel-h{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.rel-v{font-weight:800;font-size:16px}
.rel-v.current{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.rel-d{font-size:12.5px;color:var(--ink-3)}
.rel-l{list-style:none;margin:0;padding:0}
.rel-i{display:flex;gap:10px;padding:7px 0;font-size:14px;color:var(--ink-2)}
.rel-k{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;flex:none}
.rel-k svg{width:15px;height:15px}
.rel-i.new .rel-k{background:var(--accent-soft);color:var(--accent)}
.rel-i.fix .rel-k{background:var(--warn-soft);color:var(--warn)}
.rel-i.better .rel-k{background:var(--good-soft);color:var(--good)}

/* ---------- workout player ---------- */
.player{text-align:center;padding:10px 0}
.player .pex{font-size:24px;font-weight:800;margin:8px 0 2px}
.player .ptime{font-size:56px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.player .pring{width:220px;height:220px;margin:0 auto;position:relative}
.player .pring .pc{position:absolute;inset:0;display:grid;place-items:center;align-content:center}

/* ---------- exercise animations ---------- */
.move{background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:14px;margin:4px 0 12px;overflow:hidden;position:relative}
.move svg{width:100%;height:auto;max-height:190px;display:block;padding-top:14px}
.move::after{content:"▶ How to do it";position:absolute;left:10px;top:7px;font-size:10.5px;font-weight:700;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.move.bare::after{display:none}
/* The drawn figure is line art on white, in the same hand as the
   Everkinetic illustrations it stands in for: white fills, dark outlines. */
.move{--skin:#FFFFFF;--skin-f:#F1F1F3;--shirt:#FFFFFF;--shirt-f:#F1F1F3;--shorts:#FFFFFF;--shorts-f:#F1F1F3;--shoe:#FFFFFF;--shoe-f:#F1F1F3;--outline:#1F1B24;background:#FFFFFF;border-color:#E6E3EE}
.move::after{color:#8A84A3}
.mv-skin,.mv-shirt,.mv-shorts{fill:var(--skin);stroke:var(--outline);stroke-width:.9;stroke-linejoin:round}
.mv-skin.f,.mv-shirt.f,.mv-shorts.f{fill:var(--skin-f)}
.mv-shoe{fill:var(--shoe);stroke:var(--outline);stroke-width:.9}
.mv-shoe.f{fill:var(--shoe-f)}
.mv-hair{fill:none;stroke:var(--outline);stroke-width:1.1;stroke-linecap:round}
.mv-hi{display:none}
.move .mv-floor{stroke:#D8D4E4}
.move .mv-prop{fill:#E9E6F0}
.move .mv-mat{fill:#EEE9FB}
.move .mv-hill{fill:#E3F4E8}
/* illustrations: start and finish, the finish fading in and out */
.move.ek{padding:22px 8px 6px}
.ek-stage{position:relative;display:grid;place-items:center;height:170px}
.ek-stage img{grid-area:1/1;max-width:100%;max-height:170px;width:auto;height:100%;object-fit:contain;user-select:none}
.ek-end{animation:ekSwap 3.4s ease-in-out infinite;animation-delay:var(--ek-at,0ms)}
.ek-tag{position:absolute;right:6px;top:-16px;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:#EEE9FB;color:#5B21B6}
.ek-b{animation:ekSwap 3.4s ease-in-out infinite;animation-delay:var(--ek-at,0ms);background:#FFEDD5;color:#9A3412}
.ek-a{animation:ekSwap 3.4s ease-in-out infinite reverse;animation-delay:var(--ek-at,0ms)}
@keyframes ekSwap{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.ek-end,.ek-b{opacity:0}.ek-a{opacity:1}}
.mv-db{fill:#3F4654;stroke:#1F2430;stroke-width:.5}
.mv-wheel{fill:none;stroke:#334155;stroke-width:2.6}
.mv-spoke{stroke:#94A3B8;stroke-width:.6;fill:none}
.mv-frame{stroke:#E11D48;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;fill:#E11D48}
path.mv-frame{fill:none}
.mv-crank{stroke:#475569;stroke-linecap:round;fill:none}
.mv-chain{stroke:#64748B;fill:none}
.mv-rope{stroke:#F97316;stroke-width:1.4;fill:none}
.mv-pole{stroke:#64748B;stroke-linecap:round}
.mv-racket{fill:rgba(255,255,255,.35);stroke:#E11D48;stroke-width:1.2}
.mv-water{fill:#38BDF8;opacity:.28}
.mv-wave{fill:none;stroke:#38BDF8;stroke-width:1.2;opacity:.8}
.mv-hill{fill:color-mix(in oklab,#22C55E 30%,var(--surface))}
.mv-road{stroke:var(--line-strong);stroke-width:1.5;stroke-dasharray:6 8;animation:mvRoad .6s linear infinite}
.mv-spin{animation:mvSpin .55s linear infinite}
@keyframes mvRoad{to{stroke-dashoffset:14}}
@keyframes mvSpin{to{transform:rotate(360deg)}}
.mv-dbh{fill:#9AA3B2}
.mv-floor{stroke:var(--line-strong);stroke-width:1.5}
.move svg .mv-floor{vector-effect:non-scaling-stroke}
.mv-mat{fill:color-mix(in oklab,var(--accent) 22%,var(--surface))}
.mv-prop{fill:var(--line-strong)}
.mv-bar{stroke:var(--ink-3);stroke-width:3;stroke-linecap:round}
.mv-band{stroke:var(--flame);fill:none}

/* ---------- confetti ---------- */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;opacity:.95;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--r));opacity:.9}}

@media (min-width:700px){
  .top h1{font-size:32px}
  .tiles.wide{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>

  <button class="tab" data-view="diary" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h11a2 2 0 012 2v13a2 2 0 01-2 2H6z"/><path d="M6 3.5v17M9.5 8h6M9.5 11.5h6"/><path d="M4 7h3.5M4 12h3.5M4 17h3.5"/></svg>Diary</button>
